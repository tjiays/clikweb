# Production nginx for cbclik.com.
#
# Not installed by this repository — copy it to the production server, adjust
# the certificate paths, test with `nginx -t`, then reload.
#
# The redirect map is generated: deploy/redirects.map.

map $uri $legacy_redirect {
    default "";
    include /etc/nginx/clik/redirects.map;
}

server {
    listen 80;
    listen [::]:80;
    server_name cbclik.com www.cbclik.com;

    # Everything goes over HTTPS.
    location / {
        return 301 https://cbclik.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.cbclik.com;

    ssl_certificate     /etc/letsencrypt/live/cbclik.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cbclik.com/privkey.pem;

    # The old site already treats the apex as canonical; keep it that way so
    # search engines do not see two copies of every page.
    return 301 https://cbclik.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cbclik.com;

    ssl_certificate     /etc/letsencrypt/live/cbclik.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cbclik.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 25M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Tells browsers to use HTTPS for a year. Only enable once the certificate
    # is confirmed working — it is hard to undo.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---- Redirects from the old site ----
    # Permanent, so search engines transfer the ranking the old pages hold.
    # A trailing slash is stripped first so both forms match one entry.
    location ~ ^(?<clean>.+)/$ {
        return 301 $scheme://$host$clean;
    }

    if ($legacy_redirect != "") {
        return 301 $scheme://$host$legacy_redirect;
    }

    # ---- Uploaded media, served from disk ----
    location /media/ {
        alias /home/dnugroho/clikwebsite/public/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- Next.js build output ----
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- The application ----
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The contact form's rate limiting reads this header, so it must be
        # set or every visitor looks like the same address.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
