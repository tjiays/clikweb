# Production nginx for cbclik.com.
#
# Not installed by this repository — copy it to the production server, adjust
# the certificate paths, test with `nginx -t`, then reload.
#
# The redirect map is generated: deploy/redirects.map.

# Must come before the first map block. The redirect map's keys are old URLs, many of them long. With nginx's
# default bucket size the map cannot be built and `nginx -t` fails outright.
map_hash_bucket_size 256;

# ---- Page cache for anonymous visitors ----
# The app rebuilds every page per request: under 50 simultaneous visitors the
# homepage took a median 2.7 s on staging. A 60-second copy for anonymous
# visitors took that to about 50 ms at ~970 pages/s, with no database work.
# Anyone signed in to the CMS or previewing always bypasses it.
proxy_cache_path /var/cache/nginx/clik levels=1:2 keys_zone=clik_pages:10m
                 max_size=500m inactive=10m use_temp_path=off;

# Signed-in CMS users and editors previewing drafts never get, or fill, the
# shared cache.
map $http_cookie $clik_personal {
    default 0;
    ~*payload-token 1;
    ~*__prerender_bypass 1;
}

# Never cached: the CMS, the API, preview, and image resizing (which varies by
# the browser's Accept header, not in the key).
map $uri $clik_uncacheable {
    default 0;
    ~^/(admin|api|preview|_next/image) 1;
}

map $uri $legacy_redirect {
    default "";
    include /etc/nginx/clik/redirects.map;
}

server {
    listen 80;
    listen [::]:80;
    server_name cbclik.com www.cbclik.com;

    # Everything goes over HTTPS.
    location / {
        return 301 https://cbclik.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.cbclik.com;

    ssl_certificate     /etc/letsencrypt/live/cbclik.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cbclik.com/privkey.pem;

    # The old site already treats the apex as canonical; keep it that way so
    # search engines do not see two copies of every page.
    return 301 https://cbclik.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cbclik.com;

    ssl_certificate     /etc/letsencrypt/live/cbclik.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cbclik.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 25M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Tells browsers to use HTTPS only, so they never send the login cookie
    # over plain http. Starts at one day because it is hard to undo: a broken
    # certificate would otherwise lock visitors out for a year. After a week
    # of confirmed HTTPS, raise it to max-age=31536000 (cutover runbook).
    add_header Strict-Transport-Security "max-age=86400; includeSubDomains" always;

    # ---- Redirects from the old site ----
    # Permanent, so search engines transfer the ranking the old pages hold.
    # A trailing slash is stripped first so both forms match one entry.
    location ~ ^(?<clean>.+)/$ {
        return 301 $scheme://$host$clean;
    }

    if ($legacy_redirect != "") {
        return 301 $scheme://$host$legacy_redirect;
    }

    # ---- Uploaded media, served from disk ----
    location /media/ {
        # The release layout's shared folder (deploy/release.sh). nginx runs as
        # www-data and cannot enter a private home folder, which is why the app
        # does not live under /home in production.
        alias /srv/clik/shared/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # nginx drops server-level add_header lines in any location that sets
        # its own, so the security headers are repeated here. Without this,
        # every image and script went out with none of them.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=86400; includeSubDomains" always;
        access_log off;
    }

    # ---- Next.js build output ----
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # nginx drops server-level add_header lines in any location that sets
        # its own, so the security headers are repeated here. Without this,
        # every image and script went out with none of them.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=86400; includeSubDomains" always;
        access_log off;
    }

    # ---- Umami analytics (docs/analytics.md) ----
    # Its own app on port 3100, serving under /analytics. The public pages load
    # its tracking script from here, so without this block production would
    # count nothing. Never cached: it is a live dashboard and an event API.
    location /analytics {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ---- The application ----
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # $http_host, not $host: $host drops the port, and the CMS then
        # refuses every save as "Invalid Server Actions request".
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        # The contact form's rate limiting reads X-Real-IP. nginx overwrites
        # it with the connecting address, so a visitor cannot forge it.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        proxy_cache clik_pages;
        # Next asks for a page's data, not its HTML, at the same URL, told
        # apart by these headers. Keyed on the URL alone, a browser could be
        # handed the data where it expects a page.
        proxy_cache_key "$scheme$host$request_uri|$http_rsc|$http_next_router_state_tree|$http_next_router_prefetch|$http_next_router_segment_prefetch";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 60s;
        # The app marks every page no-store because it renders per request.
        # Overriding that is safe only because of the bypass rules; a response
        # that sets a cookie is still never stored.
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_bypass $clik_personal $clik_uncacheable $http_authorization;
        proxy_no_cache     $clik_personal $clik_uncacheable $http_authorization;
        # One request rebuilds an expired page; the rest get the old copy,
        # which also keeps pages up through a brief app failure.
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503;
        add_header X-Cache-Status $upstream_cache_status always;
        # Any add_header here drops the server-level ones, so they are repeated.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=86400; includeSubDomains" always;
    }
}
